<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빛밤 피드 메이커</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            color: #2f3640;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 메인 워크스페이스 컨테이너 */
        .workspace-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1050px; 
            box-sizing: border-box;
        }

        /* Control Panel Styles */
        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 35px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            flex-shrink: 0; 
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #353b48;
        }

        .control-group input[type="text"], .control-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #c8d6e5;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: border 0.2s;
        }

        /* 세로로만 늘어나는 Textarea */
        .control-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #c8d6e5;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            transition: border 0.2s;
            resize: vertical;
            min-height: 60px;
        }

        .control-group input:focus, .control-group textarea:focus {
            border-color: #54a0ff;
            outline: none;
        }

        /* 체크박스 커스텀 라벨 스타일 */
        .checkbox-label {
            display: flex !important;
            align-items: center;
            gap: 8px;
            font-size: 13px !important;
            font-weight: 500 !important;
            color: #57606f !important;
            margin-top: 8px;
            margin-bottom: 0 !important;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #FF8897;
        }

        /* Profile Upload Zone */
        .profile-upload-zone {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .mini-preview {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            background-color: #dfe6e9;
            background-image: url('https://via.placeholder.com/50');
            background-size: cover;
            background-position: center;
            border: none;
            flex-shrink: 0;
        }

        .post-image-upload-zone {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* 동적 댓글/답글 입력창 스타일 */
        .comment-input-card {
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .comment-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-input-header span {
            font-weight: bold;
            font-size: 13px;
            color: #2f3640;
        }

        .reply-input-card {
            background-color: #ffffff;
            border: 1px dashed #c8d6e5;
            border-radius: 6px;
            padding: 10px;
            margin-top: 8px;
            margin-left: 6px; 
            box-sizing: border-box;
        }

        .btn-small-danger {
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-small-add {
            background-color: #9b9c9e;
            color: #2f3640;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-add-comment {
            background-color: #7d7e80;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }

        /* Crop Modal Styles */
        .crop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .crop-content {
            background: white;
            padding: 20px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .crop-container {
            max-height: 320px;
            margin-bottom: 15px;
            overflow: hidden;
            background: #eee;
            border-radius: 10px;
            border: none;
        }

        .crop-container img {
            max-width: 100%;
        }

        .crop-buttons {
            display: flex;
            gap: 8px;
        }

        .crop-buttons button {
            border: none !important;
            border-radius: 6px !important;
        }

        .btn-sub {
            background-color: #718093 !important;
            box-shadow: 0 4px 6px rgba(113, 128, 147, 0.2) !important;
        }

        .btn-reset {
            background-color: #e67e22 !important;
            box-shadow: 0 4px 6px rgba(230, 126, 34, 0.2) !important;
        }

        .btn-danger {
            width: auto !important;
            padding: 10px 15px !important;
            background-color: #7d7e80 !important;
            color: #ffffff !important; 
            border: none !important;
            border-radius: 6px !important;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2) !important;
            font-size: 13px !important;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* 이미지 저장하기 버튼 스타일 */
        button.btn-main-save {
            width: 100%;
            padding: 14px;
            background-color: #49494a; 
            color: #ffffff; 
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(255, 190, 190, 0.4);
        }

        button.btn-main-save:hover {
            background-color: #ffaAAA; 
        }
        button.btn-main-save:active {
            transform: scale(0.99);
        }

        /* 우측 미리보기 전용 정렬 영역 */
        .preview-side-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            flex-grow: 1; 
        }

        .preview-title {
            font-weight: 700;
            color: #718093;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: left; 
        }

        /* Preview Container Frame */
        .preview-container {
            background: #ffffff;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            display: inline-block;
            width: 100%;
            max-width: 500px; 
            box-sizing: border-box;
            height: auto; 
            margin-bottom: 25px;
        }

        /* Capture Base Element */
        #capture-area {
            width: 1000px; 
            height: auto; 
            background-color: #FAFAFA;
            padding: 60px 48px 60px 48px;
            box-sizing: border-box;
            transform-origin: top left;
            margin-bottom: 0; 
        }

        /* Main Post Layout */
        .main-post {
            display: flex;
            gap: 34px;
            position: relative;
            margin-bottom: 24px;
        }

        .profile-img {
            width: 122px;
            height: 122px;
            border-radius: 10px;
            background-color: #dfe6e9;
            background-image: url('https://via.placeholder.com/150'); 
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .post-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .author-name {
            color: #6C7BA5;
            font-weight: 400;
            font-size: 40px;
            margin: 0 0 11px 0;
            min-height: 45px;
            text-align: left;
        }

        .post-text {
            color: #5B5B5B;
            font-size: 36px;
            line-height: 1.3;
            margin: 0;
            white-space: pre-wrap;
            text-align: left;
        }

        /* Attached Image Frame */
        .post-attached-image-container {
            display: none; 
            margin-left: 156px; 
            margin-bottom: 24px; 
            width: calc(100% - 156px);
            border-radius: 12px;
            overflow: hidden;
        }

        .post-attached-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Interaction Icons */
        .interaction-icons {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 34px;
            margin-top: -10px;    
            margin-bottom: 18px;  
            padding-right: 12px;
        }

        .icon-heart {
            width: 68px;
            height: 68px; 
            transition: all 0.1s ease;
        }

        .icon-heart.outline-style {
            fill: none !important;
            stroke: #5B5B5B !important;
            stroke-width: 0.5px !important;
        }

        .icon-heart.fill-style {
            fill: #FF8897 !important;
            stroke: none !important;
            stroke-width: 0 !important;
        }

        #view-main-heart path {
            vector-effect: non-scaling-stroke;
        }

        .icon-comment {
            width: 64px;
            height: 64px; 
        }

        /* Comment Box Layout */
        .comment-box {
            background-color: #F0F0F0;
            border-radius: 12px;
            padding: 18px 38px 24px 28px;
            font-size: 35px;
            margin-left: 156px; 
            text-align: left !important;
            box-sizing: border-box;
        }

        #view-comments-list {
            width: 100%;
            text-align: left !important;
            display: block !important;
        }

        .comment-item {
            text-align: left !important; 
            margin: 2px 0 0 0 !important;
            padding: 0 !important;
            width: 100% !important;
            display: block !important;
            box-sizing: border-box;
        }

        .comment-item:first-child {
            margin-top: 0 !important;
        }

        .comment-item.is-reply {
            margin: 2px 0 0 0 !important;
            padding: 0 !important; 
            text-align: left !important;
            width: 100% !important;
            display: block !important;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 0;
            text-align: left !important;
            width: 100%;
            margin-bottom: 6px;
        }

        .comment-heart {
            font-size: 32px;
            color: #6C7BA5;
        }

        .comment-user {
            font-weight: 400;
            color: #6C7BA5;
        }

        .comment-body {
            color: #5B5B5B;
            line-height: 1.25;
            white-space: pre-wrap;
            margin: 0 !important;
            padding: 0 !important;
            text-align: left !important; 
            display: block !important;
            width: 100% !important;
        }

        .reply-user {
            font-weight: 400;
            color: #6C7BA5;
        }

        .reply-text-center {
            color: #5B5B5B;
            font-weight: 400;
        }

        .unofficial-notice {
            text-align: right;
            color: #BCBCBC;
            font-size: 22px;
            font-weight: 400;
            margin-top: 50px;
            padding-right: 12px;
            letter-spacing: -0.5px;
        }

        @media (max-width: 930px) {
            .workspace-container {
                flex-direction: column;
                align-items: center;
            }
            .control-panel, .preview-side-zone {
                max-width: 500px;
            }
            .preview-title {
                text-align: center;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>빛밤 피드 메이커</h1>
    <div class="subtitle">문제될 시 삭제. 출처 표기 안해도 됨. 2차공유는 비계나 1대1로만. 외에는 알잘딱 자유롭게 써주시길...</div>

    <!-- 메인 워크스페이스 -->
    <div class="workspace-container">
        
        <!-- LEFT SIDE: 컨트롤 패널 -->
        <div class="control-panel">
            <div class="control-group">
                <label>1. 프로필 사진 업로드 (크롭 가능)</label>
                <div class="profile-upload-zone">
                    <div class="mini-preview" id="mini-profile-preview"></div>
                    <input type="file" id="input-profile-img" accept="image/*" onchange="initProfileCropper(event)">
                </div>
            </div>
            <div class="control-group">
                <label>2. 피드 작성자 이름</label>
                <input type="text" id="input-name" value="" placeholder="이름을 입력하세요" oninput="updateText()">
            </div>
            <div class="control-group">
                <label>3. 피드 내용</label>
                <textarea id="input-text" rows="2" placeholder="피드 본문 내용을 입력하세요" oninput="updateText()"></textarea>
            </div>
            <div class="control-group">
                <label>4. 피드 이미지 첨부 (크롭 가능/자유 비율)</label>
                <div class="post-image-upload-zone">
                    <input type="file" id="input-post-attached-image" accept="image/*" onchange="initPostCropper(event)">
                    <button class="btn-danger" onclick="removePostImage()">이미지 삭제</button>
                </div>
            </div>

            <!-- 동적 댓글 컨테이너 -->
            <div class="control-group">
                <label>5. 댓글 및 답글 관리</label>
                <div id="comments-input-list"></div>
                <button type="button" class="btn-add-comment" onclick="addCommentInput()">+ 댓글 추가</button>
            </div>

            <!-- 하트 채우기 수동 스위치 옵션 -->
            <div class="control-group">
                <label>6. 좋아요한 사람</label>
                <input type="text" id="input-heart-user" placeholder="비울 수 있음" oninput="handleHeartUserInput()">
                <label class="checkbox-label">
                    <input type="checkbox" id="input-heart-fill-toggle" onchange="updateText()">
                    좋아요 누르기
                </label>
            </div>
            <button class="btn-main-save" onclick="downloadImage()">이미지 저장하기</button>
        </div>

        <!-- RIGHT SIDE: 미리보기 -->
        <div class="preview-side-zone">
            <div class="preview-title">미리보기</div>
            <div class="preview-container" id="container-frame">
                <div id="capture-area">
                    
                    <div class="main-post">
                        <div class="profile-img" id="view-profile-img"></div>
                        <div class="post-content">
                            <p class="author-name" id="view-name"></p>
                            <p class="post-text" id="view-text"></p>
                        </div>
                    </div>

                    <div class="post-attached-image-container" id="view-post-attached-image-container">
                        <img id="view-post-attached-image" src="">
                    </div>

                    <div class="interaction-icons">
                        <svg class="icon-heart outline-style" id="view-main-heart" viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <svg class="icon-comment" viewBox="0 0 24 24" fill="#FF8897">
                            <path d="M11 2C5.48 2 1 6.48 1 12s4.48 10 10 10c1.82 0 3.53-.49 5.01-1.34L21.5 22c.36.11.71-.23.6-.6l-1.34-5.49C21.51 15.53 22 13.82 22 12c0-5.52-4.48-10-10-10z"/>
                        </svg>
                    </div>

                    <div class="comment-box">
                        <div class="comment-header" id="view-comment-header" style="display: none;">
                            <span class="comment-heart">♡</span> 
                            <span class="comment-user" id="view-heart-user"></span>
                        </div>

                        <!-- 댓글들이 동적으로 출력되는 뷰존 -->
                        <div id="view-comments-list"></div>
                    </div>

                    <div class="unofficial-notice">*이 이미지는 비공식 이미지입니다.</div>

                </div>
            </div>
        </div>

    </div>

    <!-- Crop Modals -->
    <div class="crop-modal" id="profileCropModal">
        <div class="crop-content">
            <h3>프로필 이미지 자르기 (1:1 고정)</h3>
            <div class="crop-container">
                <img id="profileCropImage" src="">
            </div>
            <div class="crop-buttons">
                <button class="btn-reset" onclick="resetProfileCropper()">초기화</button>
                <button class="btn-sub" onclick="closeProfileModal()">취소</button>
                <button onclick="cropAndApplyProfile()">자르기 완료</button>
            </div>
        </div>
    </div>

    <div class="crop-modal" id="postCropModal">
        <div class="crop-content">
            <h3>피드 이미지 자르기 (자유 비율)</h3>
            <div class="crop-container">
                <img id="postCropImage" src="">
            </div>
            <div class="crop-buttons">
                <button class="btn-reset" onclick="resetPostCropper()">초기화</button>
                <button class="btn-sub" onclick="closePostModal()">취소</button>
                <button onclick="cropAndApplyPost()">자르기 완료</button>
            </div>
        </div>
    </div>

    <script>
        const captureArea = document.getElementById('capture-area');
        const containerFrame = document.getElementById('container-frame');
        let profileCropper = null;
        let postCropper = null;

        // 댓글 데이터 배열 관리 (targetUser 필드 추가)
        let commentsData = [
            {
                id: Date.now(),
                user: '',
                text: '',
                replies: [
                    { id: Date.now() + 1, user: '', targetUser: '', text: '' }
                ]
            }
        ];

        function updateResponsiveScale() {
            const currentContainerWidth = containerFrame.clientWidth;
            const calculatedScale = currentContainerWidth / 1000;
            const originalHeight = captureArea.scrollHeight;
            
            captureArea.style.transform = `scale(${calculatedScale})`;
            captureArea.style.marginBottom = `-${originalHeight * (1 - calculatedScale)}px`;
            containerFrame.style.height = `${(originalHeight * calculatedScale)}px`; 
        }

        const resizeObserver = new ResizeObserver(() => {
            updateResponsiveScale();
        });
        resizeObserver.observe(containerFrame); 
        resizeObserver.observe(captureArea);

        window.addEventListener('resize', updateResponsiveScale);
        window.addEventListener('load', updateResponsiveScale);

        // 프로필 크롭
        function initProfileCropper(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageEl = document.getElementById('profileCropImage');
                imageEl.src = e.target.result;
                document.getElementById('profileCropModal').style.display = 'flex';
                
                if (profileCropper) { profileCropper.destroy(); }
                profileCropper = new Cropper(imageEl, {
                    aspectRatio: 1, 
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false,
                    zoomable: true,
                    zoomOnWheel: true,
                    zoomOnTouch: true
                });
            };
            reader.readAsDataURL(file);
        }

        function resetProfileCropper() {
            if (profileCropper) profileCropper.reset();
        }

        function cropAndApplyProfile() {
            if (!profileCropper) return;
            const canvas = profileCropper.getCroppedCanvas({ width: 350, height: 350 });
            const croppedImgUrl = `url('${canvas.toDataURL('image/png')}')`;
            document.getElementById('view-profile-img').style.backgroundImage = croppedImgUrl;
            document.getElementById('mini-profile-preview').style.backgroundImage = croppedImgUrl;
            closeProfileModal();
            setTimeout(updateResponsiveScale, 50);
        }

        function closeProfileModal() {
            document.getElementById('profileCropModal').style.display = 'none';
            document.getElementById('input-profile-img').value = '';
        }

        // 본문 이미지 크롭
        function initPostCropper(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageEl = document.getElementById('postCropImage');
                imageEl.src = e.target.result;
                document.getElementById('postCropModal').style.display = 'flex';
                
                if (postCropper) { postCropper.destroy(); }
                postCropper = new Cropper(imageEl, {
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false,
                    zoomable: true,
                    zoomOnWheel: true,
                    zoomOnTouch: true
                });
            };
            reader.readAsDataURL(file);
        }

        function resetPostCropper() {
            if (postCropper) postCropper.reset();
        }

        function cropAndApplyPost() {
            if (!postCropper) return;
            const canvas = postCropper.getCroppedCanvas(); 
            const imgTag = document.getElementById('view-post-attached-image');
            
            imgTag.src = canvas.toDataURL('image/png');
            document.getElementById('view-post-attached-image-container').style.display = 'block';
            
            imgTag.onload = function() {
                updateResponsiveScale();
            };
            
            closePostModal();
        }

        function closePostModal() {
            document.getElementById('postCropModal').style.display = 'none';
        }

        function removePostImage() {
            document.getElementById('input-post-attached-image').value = ''; 
            document.getElementById('view-post-attached-image').src = ''; 
            document.getElementById('view-post-attached-image-container').style.display = 'none'; 
            setTimeout(updateResponsiveScale, 30); 
        }

        /* --- 동적 댓글 / 답글 데이터 및 UI 제어 엔진 --- */

        function renderCommentInputs() {
            const container = document.getElementById('comments-input-list');
            container.innerHTML = '';

            commentsData.forEach((comment, cIndex) => {
                const card = document.createElement('div');
                card.className = 'comment-input-card';

                let html = `
                    <div class="comment-input-header">
                        <span>댓글 ${cIndex + 1}</span>
                        ${commentsData.length > 1 ? `<button type="button" class="btn-small-danger" onclick="removeCommentInput(${comment.id})">x 댓글 삭제</button>` : ''}
                    </div>
                    <input type="text" placeholder="댓글 작성자 이름" value="${escapeHtml(comment.user)}" oninput="updateCommentData(${comment.id}, 'user', this.value)" style="margin-bottom:5px;">
                    <textarea rows="2" placeholder="댓글 내용을 입력하세요" oninput="updateCommentData(${comment.id}, 'text', this.value)">${escapeHtml(comment.text)}</textarea>
                    
                    <div class="replies-container">
                `;

                comment.replies.forEach((reply, rIndex) => {
                    html += `
                        <div class="reply-input-card">
                            <div class="comment-input-header">
                                <span>↳ 답글 ${rIndex + 1}</span>
                                <button type="button" class="btn-small-danger" onclick="removeReplyInput(${comment.id}, ${reply.id})">x 삭제</button>
                            </div>
                            <input type="text" placeholder="답글 작성자 이름 (비워두면 게시글 작성자로 입력됩니다.)" value="${escapeHtml(reply.user)}" oninput="updateReplyData(${comment.id}, ${reply.id}, 'user', this.value)" style="margin-bottom:5px;">
                            <input type="text" placeholder="답글 받는 사람 (비워두면 댓글 작성자로 입력됩니다.)" value="${escapeHtml(reply.targetUser)}" oninput="updateReplyData(${comment.id}, ${reply.id}, 'targetUser', this.value)" style="margin-bottom:5px;">
                            <textarea rows="2" placeholder="답글 내용을 입력하세요" oninput="updateReplyData(${comment.id}, ${reply.id}, 'text', this.value)">${escapeHtml(reply.text)}</textarea>
                        </div>
                    `;
                });

                html += `
                    </div>
                    <button type="button" class="btn-small-add" onclick="addReplyInput(${comment.id})">+ 답글 추가</button>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });

            updateText();
        }

        function escapeHtml(text) {
            if(!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function addCommentInput() {
            commentsData.push({
                id: Date.now(),
                user: '',
                text: '',
                replies: []
            });
            renderCommentInputs();
        }

        function removeCommentInput(commentId) {
            commentsData = commentsData.filter(c => c.id !== commentId);
            renderCommentInputs();
        }

        function addReplyInput(commentId) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                comment.replies.push({
                    id: Date.now(),
                    user: '',
                    targetUser: '',
                    text: ''
                });
                renderCommentInputs();
            }
        }

        function removeReplyInput(commentId, replyId) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                comment.replies = comment.replies.filter(r => r.id !== replyId);
                renderCommentInputs();
            }
        }

        function updateCommentData(commentId, field, value) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                comment[field] = value;
                updateText();
            }
        }

        function updateReplyData(commentId, replyId, field, value) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                const reply = comment.replies.find(r => r.id === replyId);
                if(reply) {
                    reply[field] = value;
                    updateText();
                }
            }
        }

        // 좋아요한 사람 입력 연동
        function handleHeartUserInput() {
            updateText();
        }

        /* --- 실시간 뷰어 업데이트 --- */

        function updateText() {
            const mainName = document.getElementById('input-name').value;
            const mainText = document.getElementById('input-text').value;
            const heartUser = document.getElementById('input-heart-user').value;
            const isHeartFill = document.getElementById('input-heart-fill-toggle').checked;

            document.getElementById('view-name').innerText = mainName;
            document.getElementById('view-text').innerText = mainText;
            document.getElementById('view-heart-user').innerText = heartUser;

            const mainHeartSvg = document.getElementById('view-main-heart');
            const heartHeader = document.getElementById('view-comment-header');
            
            // 좋아요한 사람 이름 노출 여부
            if (heartUser.trim() === "") {
                heartHeader.style.setProperty("display", "none", "important");
                heartHeader.style.marginBottom = '0px';
            } else {
                heartHeader.style.setProperty("display", "flex", "important");
                heartHeader.style.marginBottom = '14px'; 
            }

            // 하트 색상 채우기(ON/OFF) 제어
            if (isHeartFill) {
                mainHeartSvg.className.baseVal = "icon-heart fill-style";
            } else {
                mainHeartSvg.className.baseVal = "icon-heart outline-style";
            }

            // 동적 댓글 뷰어 렌더링
            const viewCommentsList = document.getElementById('view-comments-list');
            viewCommentsList.innerHTML = '';

            commentsData.forEach((comment) => {
                // 댓글 본문 렌더링
                if (comment.user || comment.text) {
                    const commentEl = document.createElement('div');
                    commentEl.className = 'comment-item';
                    
                    const delimiter = (comment.user && comment.text) ? ': ' : '';
                    commentEl.innerHTML = `<div class="comment-body"><span class="reply-user">${escapeHtml(comment.user)}</span><span>${delimiter}</span><span>${escapeHtml(comment.text)}</span></div>`;
                    viewCommentsList.appendChild(commentEl);
                }

                // 해당 댓글의 답글들 렌더링 (보내는 사람과 받는 사람 교대 설정 지원)
                comment.replies.forEach((reply) => {
                    if (reply.user || reply.targetUser || reply.text) {
                        const replyEl = document.createElement('div');
                        replyEl.className = 'comment-item is-reply';
                        
                        // 답글 작성자 (입력값 없으면 메인 피드 작성자 이름으로 자동 대체)
                        const replyAuthor = reply.user ? reply.user : mainName;
                        // 답글 받는 사람 (입력값 없으면 댓글 작성자 이름으로 자동 대체)
                        const replyTarget = reply.targetUser ? reply.targetUser : comment.user;
                        
                        const replyCenter = (replyAuthor && replyTarget) ? '답장' : '';
                        const delimiter = (replyAuthor || replyTarget) && reply.text ? ': ' : '';

                        replyEl.innerHTML = `<div class="comment-body"><span class="reply-user">${escapeHtml(replyAuthor)}</span><span class="reply-text-center">${replyCenter}</span><span class="reply-user">${escapeHtml(replyTarget)}</span><span>${delimiter}</span><span>${escapeHtml(reply.text)}</span></div>`;
                        viewCommentsList.appendChild(replyEl);
                    }
                });
            });

            setTimeout(updateResponsiveScale, 10);
        }

        function downloadImage() {
            resizeObserver.unobserve(captureArea);
            window.removeEventListener('resize', updateResponsiveScale);
            
            captureArea.style.transform = 'none';
            captureArea.style.marginBottom = '0';
            
            html2canvas(captureArea, { 
                scale: 1, 
                useCORS: true, 
                logging: false,
                allowTaint: true
            }).then(canvas => {
                const imgDataUrl = canvas.toDataURL('image/png');
                
                const link = document.createElement('a');
                link.download = 'LN_feed.png';
                link.href = imgDataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                window.addEventListener('resize', updateResponsiveScale);
                resizeObserver.observe(captureArea);
                updateResponsiveScale();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCommentInputs();
        });
    </script>
</body>
</html>
