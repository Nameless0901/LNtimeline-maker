<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빛밤 피드 메이커</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1 {
            color: #2f3640;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
            text-align: center;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
            word-break: keep-all;
        }

        /* 메인 워크스페이스 컨테이너 */
        .workspace-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1100px; 
            box-sizing: border-box;
            transition: max-width 0.3s ease;
        }

        .workspace-container.comments-popped {
            max-width: 1520px;
        }

        /* Control Panel Styles */
        .control-panel {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(116, 125, 140, 0.08);
            margin-bottom: 35px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            flex-shrink: 0; 
            transition: max-width 0.3s ease;
        }

        .workspace-container.comments-popped .control-panel {
            max-width: 380px;
        }

        /* 댓글 사이드 패널 */
        .comments-side-panel {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(116, 125, 140, 0.08);
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            flex-shrink: 0;
            display: none;
            flex-direction: column;
            max-height: 720px; 
            overflow-y: auto;
            border: none;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .workspace-container.comments-popped .comments-side-panel {
            display: flex;
            max-width: 440px;
        }

        /* 스크롤바 색상을 회색톤으로 변경 */
        .comments-side-panel::-webkit-scrollbar {
            width: 6px;
        }
        .comments-side-panel::-webkit-scrollbar-track {
            background: #f1f2f6;
            border-radius: 4px;
        }
        .comments-side-panel::-webkit-scrollbar-thumb {
            background: #c8d6e5;
            border-radius: 4px;
        }
        .comments-side-panel::-webkit-scrollbar-thumb:hover {
            background: #a4b0be;
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #353b48;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .control-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
            background-color: #fdfefe;
        }

        /* 파일 선택 인풋 박스 스타일 통일 */
        .control-group input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13px;
            transition: all 0.2s;
            background-color: #fdfefe;
            color: #57606f;
        }

        .control-group input[type="file"]::file-selector-button {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #ff6b81;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .control-group input[type="file"]::file-selector-button:hover {
            background-color: #ff8897;
            color: white;
            border-color: #ff8897;
        }

        .control-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dfe4ea;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
            resize: vertical;
            min-height: 60px;
            background-color: #fdfefe;
        }

        .control-group input:focus, .control-group textarea:focus {
            border-color: #ff8897;
            box-shadow: 0 0 0 3px rgba(255, 136, 151, 0.15);
            outline: none;
        }

        /* 체크박스 커스텀 라벨 스타일 */
        .checkbox-label {
            display: flex !important;
            align-items: center;
            gap: 8px;
            font-size: 13px !important;
            font-weight: 500 !important;
            color: #57606f !important;
            margin-top: 8px;
            margin-bottom: 0 !important;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-color: #fdfefe;
            border: 1px solid #dfe4ea;
            border-radius: 4px;
            display: inline-block;
            position: relative;
            transition: all 0.2s;
        }

        .checkbox-label input[type="checkbox"]:checked {
            background-color: #ff8897;
            border-color: #ff8897;
        }

        .checkbox-label input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-header-row label {
            font-family: 'Noto Sans KR', sans-serif !important;
            font-size: 14px !important;
            font-weight: 700 !important;
            color: #353b48 !important;
            margin-bottom: 0 !important;
        }

        .btn-pop-toggle {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #ff6b81;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-pop-toggle:hover {
            background-color: #ff8897;
            color: white;
            border-color: #ff8897;
        }

        .profile-upload-zone {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .mini-preview {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background-color: #dfe6e9;
            background-image: url('https://via.placeholder.com/50');
            background-size: cover;
            background-position: center;
            border: 2px solid #f1f2f6;
            flex-shrink: 0;
        }

        .post-image-upload-zone {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .comment-input-card {
            background-color: #ffffff;
            border: 1px solid #e4e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            position: relative;
        }

        .comment-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f2f6;
        }

        .comment-input-header span {
            font-weight: 700;
            font-size: 13px;
            color: #ff6b81;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .reply-input-card {
            background-color: #fafbfc;
            border: 1px solid #edf2f7;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .btn-small-danger {
            background-color: #ff8897;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .btn-small-danger:hover {
            background-color: #ff526d;
        }

        .btn-small-add {
            background-color: #fff0f3;
            color: #ff6b81;
            border: 1px solid #ffccd5;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .btn-small-add:hover {
            background-color: #ff8897;
            color: white;
            border-color: #ff8897;
        }

        .btn-add-comment {
            background-color: #ffffff;
            color: #ff6b81;
            border: 2px dashed #ffccd5;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: all 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .btn-add-comment:hover {
            background-color: #fff0f3;
            border-color: #ff8897;
        }

        .crop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(47, 54, 64, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .crop-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .crop-content h3 {
            margin-top: 0;
            color: #2f3640;
            font-size: 18px;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .crop-container {
            max-height: 320px;
            margin-bottom: 15px;
            overflow: hidden;
            background: #f1f2f6;
            border-radius: 12px;
        }

        .crop-container img {
            max-width: 100%;
        }

        .crop-buttons {
            display: flex;
            gap: 10px;
        }

        .crop-buttons button {
            flex: 1;
            padding: 12px;
            border: none !important;
            border-radius: 8px !important;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .crop-buttons button:active {
            transform: scale(0.98);
        }

        .btn-sub {
            background-color: #a4b0be !important;
        }
        .btn-sub:hover {
            background-color: #747d8c !important;
        }

        .btn-reset {
            background-color: #ffa502 !important;
        }
        .btn-reset:hover {
            background-color: #ff7f50 !important;
        }

        .crop-buttons button:not(.btn-sub):not(.btn-reset) {
            background-color: #ff8897 !important;
        }
        .crop-buttons button:not(.btn-sub):not(.btn-reset):hover {
            background-color: #ff6b7d !important;
        }

        .btn-danger {
            width: auto !important;
            padding: 10px 16px !important;
            background-color: #ffa8b6 !important;
            color: #ffffff !important; 
            border: none !important;
            border-radius: 8px !important;
            font-size: 13px !important;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .btn-danger:hover {
            background-color: #ff7685 !important;
        }

        button.btn-main-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff8897 0%, #ff6b81 100%); 
            color: #ffffff; 
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 136, 151, 0.35);
            font-family: 'Noto Sans KR', sans-serif;
        }

        button.btn-main-save:hover {
            background: linear-gradient(135deg, #ff7685 0%, #ff526d 100%); 
            box-shadow: 0 6px 20px rgba(255, 136, 151, 0.5);
            transform: translateY(-1px);
        }
        button.btn-main-save:active {
            transform: scale(0.99);
        }

        /* 우측 미리보기 전용 정렬 영역 */
        .preview-side-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            flex-grow: 1; 
            position: sticky;
            top: 30px;
        }

        .preview-title {
            font-weight: 700;
            color: #718093;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            text-align: left; 
        }

        .preview-container {
            background: #ffffff;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            display: inline-block;
            width: 100%;
            max-width: 500px; 
            box-sizing: border-box;
            height: auto; 
            margin-bottom: 25px;
        }

        #capture-area {
            width: 1000px; 
            height: auto; 
            background-color: #FAFAFA;
            padding: 60px 48px 60px 48px;
            box-sizing: border-box;
            transform-origin: top left;
            margin-bottom: 0; 
        }

        .main-post {
            display: flex;
            gap: 34px;
            position: relative;
            margin-bottom: 24px;
        }

        .profile-img {
            width: 122px;
            height: 122px;
            border-radius: 10px;
            background-color: #dfe6e9;
            background-image: url('https://via.placeholder.com/150'); 
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .post-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .author-name {
            color: #6C7BA5;
            font-weight: 400;
            font-size: 40px;
            margin: 0 0 11px 0;
            min-height: 45px;
            text-align: left;
        }

        .post-text {
            color: #5B5B5B;
            font-size: 36px;
            line-height: 1.3;
            margin: 0;
            white-space: pre-wrap;
            text-align: left;
        }

        .post-attached-image-container {
            display: none; 
            margin-left: 156px; 
            margin-bottom: 24px; 
            width: calc(100% - 156px);
            border-radius: 12px;
            overflow: hidden;
        }

        .post-attached-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .interaction-icons {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 34px;
            margin-top: -10px;    
            margin-bottom: 18px;  
            padding-right: 12px;
        }

        .icon-heart {
            width: 68px;
            height: 68px; 
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .icon-heart:hover {
            transform: scale(1.08);
        }

        .icon-heart.outline-style {
            fill: none !important;
            stroke: #5B5B5B !important;
            stroke-width: 0.5px !important;
        }

        .icon-heart.fill-style {
            fill: #FF8897 !important;
            stroke: none !important;
            stroke-width: 0 !important;
        }

        #view-main-heart path {
            vector-effect: non-scaling-stroke;
        }

        .icon-comment {
            width: 64px;
            height: 64px; 
        }

        .comment-box {
            background-color: #F0F0F0;
            border-radius: 12px;
            padding: 18px 38px 24px 28px;
            font-size: 35px;
            margin-left: 156px; 
            text-align: left !important;
            box-sizing: border-box;
        }

        #view-comments-list {
            width: 100%;
            text-align: left !important;
            display: block !important;
        }

        .comment-item {
            text-align: left !important; 
            margin: 2px 0 0 0 !important;
            padding: 0 !important;
            width: 100% !important;
            display: block !important;
            box-sizing: border-box;
        }

        .comment-item:first-child {
            margin-top: 0 !important;
        }

        .comment-item.is-reply {
            margin: 2px 0 0 0 !important;
            padding: 0 !important; 
            text-align: left !important;
            width: 100% !important;
            display: block !important;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 0;
            text-align: left !important;
            width: 100%;
            margin-bottom: 6px;
        }

        .comment-heart {
            font-size: 32px;
            color: #6C7BA5;
        }

        .comment-user {
            font-weight: 400;
            color: #6C7BA5;
        }

        .comment-body {
            color: #5B5B5B;
            line-height: 1.25;
            white-space: pre-wrap;
            margin: 0 !important;
            padding: 0 !important;
            text-align: left !important; 
            display: block !important;
            width: 100% !important;
        }

        .reply-user {
            font-weight: 400;
            color: #6C7BA5;
        }

        .reply-text-center {
            color: #5B5B5B;
            font-weight: 400;
        }

        .unofficial-notice {
            text-align: right;
            color: #BCBCBC;
            font-size: 22px;
            font-weight: 400;
            margin-top: 50px;
            padding-right: 12px;
            letter-spacing: -0.5px;
        }

        /* 반응형 모바일 최적화 미디어 쿼리 */
        @media (max-width: 1100px) {
            body {
                padding: 15px 10px;
            }
            .workspace-container,
            .workspace-container.comments-popped {
                flex-direction: column;
                align-items: center;
                max-width: 500px !important;
            }
            .control-panel, 
            .comments-side-panel, 
            .preview-side-zone {
                max-width: 100% !important;
                width: 100% !important;
                position: static !important;
            }
            .preview-title {
                text-align: center;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>빛밤 피드 메이커</h1>
    <div class="subtitle">문제될 시 삭제. 출처 표기 안해도 됨. 2차공유는 비계나 1대1로만. 외에는 알잘딱 자유롭게 써주시길...</div>

    <div class="workspace-container" id="workspace-container">
        
        <!-- 좌측 설정 패널 -->
        <div class="control-panel">
            <div class="control-group">
                <label>1. 프로필 사진 업로드 (크롭 가능)</label>
                <div class="profile-upload-zone">
                    <div class="mini-preview" id="mini-profile-preview"></div>
                    <input type="file" id="input-profile-img" accept="image/*" onchange="initProfileCropper(event)">
                </div>
            </div>
            <div class="control-group">
                <label>2. 피드 작성자 이름</label>
                <input type="text" id="input-name" value="" placeholder="이름을 입력하세요" oninput="updateText()">
            </div>
            <div class="control-group">
                <label>3. 피드 내용</label>
                <textarea id="input-text" rows="2" placeholder="피드 본문 내용을 입력하세요" oninput="updateText()"></textarea>
            </div>
            <div class="control-group">
                <label>4. 피드 이미지 첨부 (크롭 가능/자유 비율)</label>
                <div class="post-image-upload-zone">
                    <input type="file" id="input-post-attached-image" accept="image/*" onchange="initPostCropper(event)">
                    <button class="btn-danger" onclick="removePostImage()">이미지 삭제</button>
                </div>
            </div>

            <!-- 5. 좋아요한 사람 (순서 변경 및 번호 교체) -->
            <div class="control-group">
                <label>5. 좋아요한 사람</label>
                <input type="text" id="input-heart-user" placeholder="비울 수 있음" oninput="handleHeartUserInput()">
                <label class="checkbox-label">
                    <input type="checkbox" id="input-heart-fill-toggle" onchange="updateText()">
                    좋아요 누르기
                </label>
            </div>

            <!-- 6. 댓글 및 답글 관리 (인라인 위치) -->
            <div class="control-group" id="inline-comments-group">
                <div class="section-header-row">
                    <label>6. 댓글 및 답글 관리</label>
                    <button type="button" class="btn-pop-toggle" id="btn-pop-inline" onclick="toggleCommentsPanel()">
                        <span>옆으로 빼기</span> <span id="toggle-arrow">▶</span>
                    </button>
                </div>
                <div id="comments-input-list-inline"></div>
                <button type="button" class="btn-add-comment" onclick="addCommentInput()">+ 댓글 추가</button>
            </div>

            <button class="btn-main-save" onclick="downloadImage()">이미지 저장하기</button>
        </div>

        <!-- 6. 댓글 및 답글 관리 (사이드 패널) -->
        <div class="comments-side-panel" id="comments-side-panel">
            <div class="section-header-row">
                <label>6. 댓글 및 답글 관리</label>
                <button type="button" class="btn-pop-toggle" onclick="toggleCommentsPanel()">
                    <span id="toggle-arrow-side">◀</span> <span>원위치로</span>
                </button>
            </div>
            <div id="comments-input-list-side" style="flex-grow: 1; margin-top: 10px;"></div>
            <button type="button" class="btn-add-comment" onclick="addCommentInput()" style="margin-top: 10px;">+ 댓글 추가</button>
        </div>

        <!-- 우측 미리보기 -->
        <div class="preview-side-zone">
            <div class="preview-title">미리보기</div>
            <div class="preview-container" id="container-frame">
                <div id="capture-area">
                    
                    <div class="main-post">
                        <div class="profile-img" id="view-profile-img"></div>
                        <div class="post-content">
                            <p class="author-name" id="view-name"></p>
                            <p class="post-text" id="view-text"></p>
                        </div>
                    </div>

                    <div class="post-attached-image-container" id="view-post-attached-image-container">
                        <img id="view-post-attached-image" src="">
                    </div>

                    <div class="interaction-icons">
                        <svg class="icon-heart outline-style" id="view-main-heart" viewBox="0 0 24 24" onclick="toggleHeart()">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <svg class="icon-comment" viewBox="0 0 24 24" fill="#FF8897">
                            <path d="M11 2C5.48 2 1 6.48 1 12s4.48 10 10 10c1.82 0 3.53-.49 5.01-1.34L21.5 22c.36.11.71-.23.6-.6l-1.34-5.49C21.51 15.53 22 13.82 22 12c0-5.52-4.48-10-10-10z"/>
                        </svg>
                    </div>

                    <div class="comment-box">
                        <div class="comment-header" id="view-comment-header" style="display: none;">
                            <span class="comment-heart">♡</span> 
                            <span class="comment-user" id="view-heart-user"></span>
                        </div>

                        <div id="view-comments-list"></div>
                    </div>

                    <div class="unofficial-notice">*이 이미지는 비공식 이미지입니다.</div>

                </div>
            </div>
        </div>

    </div>

    <!-- Crop Modals -->
    <div class="crop-modal" id="profileCropModal">
        <div class="crop-content">
            <h3>프로필 이미지 자르기 (1:1 고정)</h3>
            <div class="crop-container">
                <img id="profileCropImage" src="">
            </div>
            <div class="crop-buttons">
                <button class="btn-reset" onclick="resetProfileCropper()">초기화</button>
                <button class="btn-sub" onclick="closeProfileModal()">취소</button>
                <button onclick="cropAndApplyProfile()">자르기 완료</button>
            </div>
        </div>
    </div>

    <div class="crop-modal" id="postCropModal">
        <div class="crop-content">
            <h3>피드 이미지 자르기 (자유 비율)</h3>
            <div class="crop-container">
                <img id="postCropImage" src="">
            </div>
            <div class="crop-buttons">
                <button class="btn-reset" onclick="resetPostCropper()">초기화</button>
                <button class="btn-sub" onclick="closePostModal()">취소</button>
                <button onclick="cropAndApplyPost()">자르기 완료</button>
            </div>
        </div>
    </div>

    <script>
        const captureArea = document.getElementById('capture-area');
        const containerFrame = document.getElementById('container-frame');
        let profileCropper = null;
        let postCropper = null;
        let isCommentsPopped = false;

        let commentsData = [
            {
                id: Date.now(),
                user: '',
                text: '',
                replies: [
                    { id: Date.now() + 1, user: '', targetUser: '', text: '' }
                ]
            }
        ];

        function toggleCommentsPanel() {
            isCommentsPopped = !isCommentsPopped;
            const workspace = document.getElementById('workspace-container');
            const inlineGroup = document.getElementById('inline-comments-group');
            
            if (isCommentsPopped) {
                workspace.classList.add('comments-popped');
                inlineGroup.style.display = 'none';
            } else {
                workspace.classList.remove('comments-popped');
                inlineGroup.style.display = 'block';
            }
            renderCommentInputs();
            setTimeout(updateResponsiveScale, 50);
        }

        function updateResponsiveScale() {
            const currentContainerWidth = containerFrame.clientWidth;
            const calculatedScale = currentContainerWidth / 1000;
            const originalHeight = captureArea.scrollHeight;
            
            captureArea.style.transform = `scale(${calculatedScale})`;
            captureArea.style.marginBottom = `-${originalHeight * (1 - calculatedScale)}px`;
            containerFrame.style.height = `${(originalHeight * calculatedScale)}px`; 
        }

        const resizeObserver = new ResizeObserver(() => {
            updateResponsiveScale();
        });
        resizeObserver.observe(containerFrame); 
        resizeObserver.observe(captureArea);

        window.addEventListener('resize', updateResponsiveScale);
        window.addEventListener('load', updateResponsiveScale);

        function initProfileCropper(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageEl = document.getElementById('profileCropImage');
                imageEl.src = e.target.result;
                document.getElementById('profileCropModal').style.display = 'flex';
                
                if (profileCropper) { profileCropper.destroy(); }
                profileCropper = new Cropper(imageEl, {
                    aspectRatio: 1, 
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false,
                    zoomable: true,
                    zoomOnWheel: true,
                    zoomOnTouch: true
                });
            };
            reader.readAsDataURL(file);
        }

        function resetProfileCropper() {
            if (profileCropper) profileCropper.reset();
        }

        function cropAndApplyProfile() {
            if (!profileCropper) return;
            const canvas = profileCropper.getCroppedCanvas({ width: 350, height: 350 });
            const croppedImgUrl = `url('${canvas.toDataURL('image/png')}')`;
            document.getElementById('view-profile-img').style.backgroundImage = croppedImgUrl;
            document.getElementById('mini-profile-preview').style.backgroundImage = croppedImgUrl;
            closeProfileModal();
            setTimeout(updateResponsiveScale, 50);
        }

        function closeProfileModal() {
            document.getElementById('profileCropModal').style.display = 'none';
            document.getElementById('input-profile-img').value = '';
        }

        function initPostCropper(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageEl = document.getElementById('postCropImage');
                imageEl.src = e.target.result;
                document.getElementById('postCropModal').style.display = 'flex';
                
                if (postCropper) { postCropper.destroy(); }
                postCropper = new Cropper(imageEl, {
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false,
                    zoomable: true,
                    zoomOnWheel: true,
                    zoomOnTouch: true
                });
            };
            reader.readAsDataURL(file);
        }

        function resetPostCropper() {
            if (postCropper) postCropper.reset();
        }

        function cropAndApplyPost() {
            if (!postCropper) return;
            const canvas = postCropper.getCroppedCanvas(); 
            const imgTag = document.getElementById('view-post-attached-image');
            
            imgTag.src = canvas.toDataURL('image/png');
            document.getElementById('view-post-attached-image-container').style.display = 'block';
            
            imgTag.onload = function() {
                updateResponsiveScale();
            };
            
            closePostModal();
        }

        function closePostModal() {
            document.getElementById('postCropModal').style.display = 'none';
        }

        function removePostImage() {
            document.getElementById('input-post-attached-image').value = ''; 
            document.getElementById('view-post-attached-image').src = ''; 
            document.getElementById('view-post-attached-image-container').style.display = 'none'; 
            setTimeout(updateResponsiveScale, 30); 
        }

        function renderCommentInputs() {
            const targetContainerId = isCommentsPopped ? 'comments-input-list-side' : 'comments-input-list-inline';
            const container = document.getElementById(targetContainerId);
            if (!container) return;
            container.innerHTML = '';

            commentsData.forEach((comment, cIndex) => {
                const card = document.createElement('div');
                card.className = 'comment-input-card';

                let html = `
                    <div class="comment-input-header">
                        <span>댓글 ${cIndex + 1}</span>
                        ${commentsData.length > 1 ? `<button type="button" class="btn-small-danger" onclick="removeCommentInput(${comment.id})">삭제</button>` : ''}
                    </div>
                    <div class="control-group" style="margin-bottom: 10px;">
                        <input type="text" placeholder="댓글 작성자 이름" value="${escapeHtml(comment.user)}" oninput="updateCommentData(${comment.id}, 'user', this.value)">
                    </div>
                    <div class="control-group" style="margin-bottom: 10px;">
                        <textarea rows="2" placeholder="댓글 내용을 입력하세요" oninput="updateCommentData(${comment.id}, 'text', this.value)">${escapeHtml(comment.text)}</textarea>
                    </div>
                    
                    <div class="replies-container">
                `;

                comment.replies.forEach((reply, rIndex) => {
                    html += `
                        <div class="reply-input-card">
                            <div class="comment-input-header">
                                <span style="color: #a4b0be; font-size: 12px;">↳ 답글 ${rIndex + 1}</span>
                                <button type="button" class="btn-small-danger" onclick="removeReplyInput(${comment.id}, ${reply.id})">삭제</button>
                            </div>
                            <div class="control-group" style="margin-bottom: 8px;">
                                <input type="text" placeholder="작성자 이름 (비워두면 기본)" value="${escapeHtml(reply.user)}" oninput="updateReplyData(${comment.id}, ${reply.id}, 'user', this.value)">
                            </div>
                            <div class="control-group" style="margin-bottom: 8px;">
                                <input type="text" placeholder="받는 사람 (비워두면 기본)" value="${escapeHtml(reply.targetUser)}" oninput="updateReplyData(${comment.id}, ${reply.id}, 'targetUser', this.value)">
                            </div>
                            <div class="control-group" style="margin-bottom: 0;">
                                <textarea rows="2" placeholder="답글 내용을 입력하세요" oninput="updateReplyData(${comment.id}, ${reply.id}, 'text', this.value)">${escapeHtml(reply.text)}</textarea>
                            </div>
                        </div>
                    `;
                });

                html += `
                    </div>
                    <button type="button" class="btn-small-add" onclick="addReplyInput(${comment.id})">+ 답글 추가</button>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });

            updateText();
        }

        function escapeHtml(text) {
            if(!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function addCommentInput() {
            commentsData.push({
                id: Date.now(),
                user: '',
                text: '',
                replies: []
            });
            renderCommentInputs();
        }

        function removeCommentInput(commentId) {
            commentsData = commentsData.filter(c => c.id !== commentId);
            renderCommentInputs();
        }

        function addReplyInput(commentId) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                comment.replies.push({
                    id: Date.now(),
                    user: '',
                    targetUser: '',
                    text: ''
                });
                renderCommentInputs();
            }
        }

        function removeReplyInput(commentId, replyId) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                comment.replies = comment.replies.filter(r => r.id !== replyId);
                renderCommentInputs();
            }
        }

        function updateCommentData(commentId, field, value) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                comment[field] = value;
                updateText();
            }
        }

        function updateReplyData(commentId, replyId, field, value) {
            const comment = commentsData.find(c => c.id === commentId);
            if(comment) {
                const reply = comment.replies.find(r => r.id === replyId);
                if(reply) {
                    reply[field] = value;
                    updateText();
                }
            }
        }

        function handleHeartUserInput() {
            updateText();
        }

        function toggleHeart() {
            const checkbox = document.getElementById('input-heart-fill-toggle');
            checkbox.checked = !checkbox.checked;
            updateText();
        }

        function updateText() {
            const mainName = document.getElementById('input-name').value;
            const mainText = document.getElementById('input-text').value;
            const heartUser = document.getElementById('input-heart-user').value;
            const isHeartFill = document.getElementById('input-heart-fill-toggle').checked;

            document.getElementById('view-name').innerText = mainName;
            document.getElementById('view-text').innerText = mainText;
            document.getElementById('view-heart-user').innerText = heartUser;

            const mainHeartSvg = document.getElementById('view-main-heart');
            const heartHeader = document.getElementById('view-comment-header');
            
            if (heartUser.trim() === "") {
                heartHeader.style.setProperty("display", "none", "important");
                heartHeader.style.marginBottom = '0px';
            } else {
                heartHeader.style.setProperty("display", "flex", "important");
                heartHeader.style.marginBottom = '14px'; 
            }

            if (isHeartFill) {
                mainHeartSvg.className.baseVal = "icon-heart fill-style";
            } else {
                mainHeartSvg.className.baseVal = "icon-heart outline-style";
            }

            const viewCommentsList = document.getElementById('view-comments-list');
            viewCommentsList.innerHTML = '';

            commentsData.forEach((comment) => {
                if (comment.user || comment.text) {
                    const commentEl = document.createElement('div');
                    commentEl.className = 'comment-item';
                    
                    const delimiter = (comment.user && comment.text) ? ': ' : '';
                    commentEl.innerHTML = `<div class="comment-body"><span class="reply-user">${escapeHtml(comment.user)}</span><span>${delimiter}</span><span>${escapeHtml(comment.text)}</span></div>`;
                    viewCommentsList.appendChild(commentEl);
                }

                comment.replies.forEach((reply) => {
                    if (reply.user || reply.targetUser || reply.text) {
                        const replyEl = document.createElement('div');
                        replyEl.className = 'comment-item is-reply';
                        
                        const replyAuthor = reply.user ? reply.user : mainName;
                        const replyTarget = reply.targetUser ? reply.targetUser : comment.user;
                        
                        const replyCenter = (replyAuthor && replyTarget) ? '답장' : '';
                        const delimiter = (replyAuthor || replyTarget) && reply.text ? ': ' : '';

                        replyEl.innerHTML = `<div class="comment-body"><span class="reply-user">${escapeHtml(replyAuthor)}</span><span class="reply-text-center">${replyCenter}</span><span class="reply-user">${escapeHtml(replyTarget)}</span><span>${delimiter}</span><span>${escapeHtml(reply.text)}</span></div>`;
                        viewCommentsList.appendChild(replyEl);
                    }
                });
            });

            setTimeout(updateResponsiveScale, 10);
        }

        function downloadImage() {
            resizeObserver.unobserve(captureArea);
            window.removeEventListener('resize', updateResponsiveScale);
            
            captureArea.style.transform = 'none';
            captureArea.style.marginBottom = '0';
            
            html2canvas(captureArea, { 
                scale: 1, 
                useCORS: true, 
                logging: false,
                allowTaint: true
            }).then(canvas => {
                const imgDataUrl = canvas.toDataURL('image/png');
                
                const link = document.createElement('a');
                link.download = 'LN_feed.png';
                link.href = imgDataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                window.addEventListener('resize', updateResponsiveScale);
                resizeObserver.observe(captureArea);
                updateResponsiveScale();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCommentInputs();
        });
    </script>
</body>
</html>
